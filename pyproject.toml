[project]
name = "eth-room-finder"
version = "1.1.0"
description = "GUI + CLI to find free rooms at ETH Zürich via the public roominfo API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pyinstaller>=6.11"]
web = ["streamlit>=1.46", "tzdata"]

[tool.uv]
package = false
